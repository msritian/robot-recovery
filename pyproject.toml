[project]
name = "robot-recovery"
version = "0.1.0"
description = "Learning fall recovery (self-righting) for legged robots under real-world disturbances"
requires-python = ">=3.10,<3.11"
dependencies = [
    "gymnasium==0.29.1",
    "mujoco==2.3.3",
    "torch==2.4.1",
    "numpy==1.24.4",
    "tensorboard>=2.10,<2.16",
    "tyro==0.5.10",
    "moviepy==1.0.3",
    "imageio>=2.14.1,<3",
    "pandas>=2.0,<2.3",
    "matplotlib>=3.7,<3.10",
    "scipy>=1.10,<1.14",
]

[tool.setuptools]
packages = ["robot_recovery"]

[tool.setuptools.package-data]
robot_recovery = ["assets/*.xml"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
